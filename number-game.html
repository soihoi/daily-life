<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숫자 맞추기 게임 - 점심시간 5분 게임</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --primary: #4f6df5;
    --primary-dark: #3b52c4;
    --text: #1f2430;
    --muted: #767d92;
    --up: #ff7a5c;
    --down: #3bb4a1;
    --border: #e3e6f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    color: var(--text);
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 12px 32px rgba(30, 40, 90, 0.08);
    text-align: center;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    background: var(--bg);
    border-radius: 12px;
    padding: 10px 16px;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--muted);
  }
  .stats b {
    color: var(--text);
    font-size: 16px;
    display: block;
  }
  .range {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="number"] {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font-size: 18px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    text-align: center;
    outline: none;
  }
  input[type="number"]:focus {
    border-color: var(--primary);
  }
  button {
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--primary);
    cursor: pointer;
    transition: background .15s ease;
  }
  button:hover { background: var(--primary-dark); }
  button:disabled { background: #c7cbe0; cursor: default; }
  .hint {
    min-height: 54px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .hint .msg {
    font-size: 17px;
    font-weight: 700;
  }
  .hint .msg.up { color: var(--up); }
  .hint .msg.down { color: var(--down); }
  .hint .msg.win { color: var(--primary); }
  .history {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 14px;
    min-height: 28px;
  }
  .chip {
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--bg);
    font-size: 12px;
    color: var(--muted);
  }
  .again {
    margin-top: 18px;
    display: none;
    width: 100%;
    padding: 12px;
  }
  .again.show { display: inline-block; }
  footer {
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
  }
  footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
  }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎯 숫자 맞추기</h1>
    <p class="subtitle">점심시간 5분, 머리 식히는 짧은 게임</p>

    <div class="stats">
      <div>시도 횟수<b id="tries">0</b></div>
      <div>경과 시간<b id="timer">00:00</b></div>
      <div>최고 기록<b id="best">-</b></div>
    </div>

    <p class="range">1 ~ 100 사이의 숫자를 맞혀보세요</p>

    <form id="guessForm">
      <input type="number" id="guessInput" min="1" max="100" placeholder="숫자 입력" autofocus>
      <button type="submit">확인</button>
    </form>

    <div class="hint">
      <div class="msg" id="msg">숫자를 입력하고 확인을 눌러보세요</div>
    </div>

    <div class="history" id="history"></div>

    <button class="again" id="againBtn">🔄 다시 하기</button>

    <footer>매번 새로운 숫자로 랜덤 시작 · 점심시간 두뇌 리프레시<br><a href="dashboard.html">📊 내 기록 대시보드 보기</a></footer>
  </div>

<script>
  const MIN = 1, MAX = 100;
  let target, tries, startTime, timerInterval, finished;

  const form = document.getElementById('guessForm');
  const input = document.getElementById('guessInput');
  const msg = document.getElementById('msg');
  const triesEl = document.getElementById('tries');
  const timerEl = document.getElementById('timer');
  const bestEl = document.getElementById('best');
  const historyEl = document.getElementById('history');
  const againBtn = document.getElementById('againBtn');

  const STATS_KEY = 'numberGameStats';

  function loadStats() {
    try {
      const raw = JSON.parse(localStorage.getItem(STATS_KEY));
      if (raw && Array.isArray(raw.history)) return raw;
    } catch (e) {}
    // migrate old single best-score key if present
    let bestTries = null;
    try {
      const legacy = parseInt(localStorage.getItem('numberGameBest'), 10);
      if (legacy) bestTries = legacy;
    } catch (e) {}
    return { totalPlays: 0, bestTries, history: [] };
  }

  function saveStats(stats) {
    try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {}
  }

  function showBest() {
    const stats = loadStats();
    bestEl.textContent = stats.bestTries ? stats.bestTries + '회' : '-';
  }

  function recordWin(triesCount, seconds) {
    const stats = loadStats();
    stats.totalPlays += 1;
    if (!stats.bestTries || triesCount < stats.bestTries) stats.bestTries = triesCount;
    stats.history.push({ tries: triesCount, seconds, date: new Date().toISOString() });
    if (stats.history.length > 20) stats.history = stats.history.slice(-20);
    saveStats(stats);
    bestEl.textContent = stats.bestTries + '회';
  }

  function formatTime(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function startTimer() {
    startTime = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      timerEl.textContent = formatTime(elapsed);
    }, 1000);
  }

  function resetGame() {
    target = Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
    tries = 0;
    finished = false;
    triesEl.textContent = '0';
    timerEl.textContent = '00:00';
    historyEl.innerHTML = '';
    msg.textContent = '숫자를 입력하고 확인을 눌러보세요';
    msg.className = 'msg';
    input.value = '';
    input.disabled = false;
    form.querySelector('button').disabled = false;
    againBtn.classList.remove('show');
    startTimer();
    input.focus();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (finished) return;
    const guess = parseInt(input.value, 10);
    if (isNaN(guess) || guess < MIN || guess > MAX) {
      msg.textContent = `${MIN}~${MAX} 사이의 숫자를 입력해주세요`;
      msg.className = 'msg';
      return;
    }
    tries++;
    triesEl.textContent = tries;

    const chip = document.createElement('span');
    chip.className = 'chip';

    if (guess === target) {
      const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
      clearInterval(timerInterval);
      finished = true;
      msg.textContent = `🎉 정답! ${tries}번 만에 맞혔어요`;
      msg.className = 'msg win';
      chip.textContent = `${guess} ✓`;
      input.disabled = true;
      form.querySelector('button').disabled = true;
      againBtn.classList.add('show');
      recordWin(tries, elapsedSeconds);
    } else if (guess < target) {
      msg.textContent = '⬆️ 더 큰 숫자예요';
      msg.className = 'msg up';
      chip.textContent = `${guess} ↑`;
    } else {
      msg.textContent = '⬇️ 더 작은 숫자예요';
      msg.className = 'msg down';
      chip.textContent = `${guess} ↓`;
    }

    historyEl.appendChild(chip);
    input.value = '';
    if (!finished) input.focus();
  });

  againBtn.addEventListener('click', resetGame);

  showBest();
  resetGame();
</script>
</body>
</html>
